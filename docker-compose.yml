version: '3.8'

services:
  greenify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenify_app
    ports:
      - "8000:8000"
    volumes:
      - ./greenify.db:/app/greenify.db
      - ./uploads:/app/uploads
    environment:
      - JWT_SECRET=greenify_production_composed_secret_7722
      - DATABASE_URL=sqlite:///./greenify.db
      # Optional: set API Keys here to unlock real LLM recommendations
      # - GEMINI_API_KEY=your_gemini_key_here
      # - OPENAI_API_KEY=your_openai_key_here
    restart: always
