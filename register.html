<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenify - Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <img src="LOGO.jpg" alt="Greenify Logo" class="auth-logo" onerror="this.src='https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=100&auto=format&fit=crop&q=60'">
                <h1 class="auth-title">GREENIFY</h1>
                <p class="auth-subtitle">Create your account to track carbon offset footprint</p>
            </div>

            <div id="alert-msg" class="alert-message alert-error"></div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="Enter username" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-submit">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus btn-icon-adjust"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign In here</a></p>
            </div>
        </div>
    </div>

    <!-- Include backend API integration files -->
    <script src="js/api.js"></script>
    <script src="register.js"></script>
</body>
</html>
