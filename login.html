<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenify - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <img src="LOGO.jpg" alt="Greenify Logo" class="auth-logo" onerror="this.src='https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=100&auto=format&fit=crop&q=60'">
                <h1 class="auth-title">GREENIFY</h1>
                <p class="auth-subtitle">Sign in to track carbon emissions and log points</p>
            </div>

            <div id="alert-msg" class="alert-message alert-error"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-submit">
                    <span>Log In</span>
                    <i class="fas fa-sign-in-alt btn-icon-adjust"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>New user? <a href="register.html">Click here to register</a></p>
            </div>
        </div>
    </div>

    <!-- Include backend API integration files -->
    <script src="js/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
