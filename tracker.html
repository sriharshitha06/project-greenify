<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tracker.css">
    <script
src="https://cdn.jsdelivr.net/npm/chart.js">
</script>
	<style>
		#chart-container {
			width: 400px;
			height: 400px;
			margin: 40px auto;
		}
	</style>
</head>
<body>
    <div class="header">
        <img src="logo.jpg" alt="Circular Image" class="circular-image">
        <div class="header-left"> REDUCE REUSE REWARD</div> </div>
        <div class="tracker-container">
            <div>
                <h1>Carbon Footprint Calculator</h1>
        
                <form class="tracker-form">
                    <label>Electricity (kWh/month):</label>
                    <input type="number" id="electricity" >
                    <br>
                    <label>LPG Cylinders/month:</label>
                    <input type="number" id="lpg" >
                    <br>
                    <label>Cylinder size(kg):</label>
                    <input type="number" id="cyl" >
                    <br>
                    <label>Petrol (liters/month):</label>
                    <input type="number" id="petrol" >
                    <br>
                    <label>Diesel (liters/month):</label>
                    <input type="number" id="diesel" >
                    <br>
                    <label>CNG (liters/month):</label>
                    <input type="number" id="cng">
                    <br>
                    <button class="tra-button" id="calculate">Calculate Carbon Footprint</button>
                </form>
            </div>
            <div>
                <p id="result"></p>
            </div>
        </div>
        <div id="chart-container">
            <canvas id="pie-chart"></canvas>
        </div>    
        <script src="tracker.js"></script>
    <div class="footer">
        @2024 Greenify All rights are reserved
    </div>
</body>
</html>
